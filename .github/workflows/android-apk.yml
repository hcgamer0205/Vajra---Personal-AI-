name: VAJRA Mobile — Real Latest APK Generation

on:
  push:
    branches: [ main, master, development ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify Latest APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Native Assets
        run: npm run assets

      - name: Run Integrity Tests
        run: npm test

      - name: Production Web Build
        run: npm run build

      - name: Capacitor Asset Sync
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          # Ensure build directory exists for desugar artifact fix
          mkdir -p app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK and Calculate Metrics
        id: verify
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Build failed: APK not found at $APK_SRC"
            exit 1
          fi
          
          # Canonical rename
          cp "$APK_SRC" VAJRA-Mobile-latest-debug.apk
          
          # Metrics
          SIZE=$(stat -c%s VAJRA-Mobile-latest-debug.apk)
          CHECKSUM=$(sha256sum VAJRA-Mobile-latest-debug.apk | awk '{print $1}')
          COMMIT=$(git rev-parse HEAD)
          
          echo "$CHECKSUM" > VAJRA-Mobile-latest-debug.apk.sha256
          
          echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          echo "APK_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT" >> $GITHUB_ENV
          
          echo "### Build Verification Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** VAJRA-Mobile-latest-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`$COMMIT\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Latest APK to Release Folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp VAJRA-Mobile-latest-debug.apk release/
          cp VAJRA-Mobile-latest-debug.apk.sha256 release/
          
          # Setup git
          git config --global user.name "VAJRA-Release-Bot"
          git config --global user.email "bot@vajra.ai"
          
          # Stage changes
          git add release/VAJRA-Mobile-latest-debug.apk
          git add release/VAJRA-Mobile-latest-debug.apk.sha256
          
          # Cleanup redundant old APKs if they exist
          declare -a redundant_apks=(
            "public/app-debug.apk"
            "dist/app-debug.apk"
            "android/app/src/main/assets/public/app-debug.apk"
          )
          for apk in "${redundant_apks[@]}"; do
            if [ -f "$apk" ]; then
              git rm "$apk"
            fi
          done
          
          # Commit and push
          git commit -m "chore: deploy official latest APK [skip ci]" || echo "No changes to commit"
          git push origin main
        continue-on-error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VAJRA-Mobile-Latest-Build
          path: |
            VAJRA-Mobile-latest-debug.apk
            VAJRA-Mobile-latest-debug.apk.sha256
          retention-days: 7

      - name: Update Latest Release Tag (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: VAJRA Mobile Latest Debug
          body: |
            Automated build of the Stark Holographic Reactor HUD.
            
            **Commit:** ${{ env.COMMIT_SHA }}
            **Size:** ${{ env.APK_SIZE }} bytes
            **Checksum:** `${{ env.APK_CHECKSUM }}`
          files: |
            VAJRA-Mobile-latest-debug.apk
            VAJRA-Mobile-latest-debug.apk.sha256
        continue-on-error: true
