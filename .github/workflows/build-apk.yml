name: Build VAJRA Mobile Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle wrapper
        run: |
          mkdir -p android/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify and inspect generated APK
        id: verify-apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file does not exist at $APK_PATH"
            exit 1
          fi

          echo "=== APK VERIFICATION SUCCESS ==="
          ls -lh "$APK_PATH"
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          echo "APK_PATH=$APK_PATH"
          echo "APK_SIZE=$FILE_SIZE bytes"
          echo "SHA256=$SHA256_HASH"
          echo "APPLICATION_ID=com.vajra.mobile"
          echo "VERSION=1.0"
          echo "VERSION_CODE=1"

          # Verify it is a valid zip / apk archive
          unzip -t "$APK_PATH" > /dev/null
          echo "APK ZIP integrity test: PASS"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vajra-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
